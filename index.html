<meta charset="utf-8">
<title>나의 자아 지형도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  :root{
    --paper:#F0F1EC;
    --plate:#FAFAF7;
    --ink:#1B2320;
    --ink-2:#465049;
    --muted:#6E7A72;
    --line:#CBD0C7;
    --line-soft:#DEE1D9;
    --moss:#2F6F5E;
    --moss-soft:#E2EBE5;
    --ochre:#A8752B;
    --ochre-soft:#F2E9D8;
    --contour:rgba(47,111,94,.20);
    --shadow:0 1px 0 rgba(27,35,32,.05), 0 18px 40px -28px rgba(27,35,32,.45);
    --focus:#A8752B;

    --f-display:"Hahmlet", "Nanum Myeongjo", serif;
    --f-body:"IBM Plex Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
    --f-mono:"IBM Plex Mono", ui-monospace, "Consolas", monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#131816;
      --plate:#1B2220;
      --ink:#E6EAE4;
      --ink-2:#B4BDB5;
      --muted:#8A968D;
      --line:#33403A;
      --line-soft:#26302B;
      --moss:#6FBFA3;
      --moss-soft:#1E2C27;
      --ochre:#D9A441;
      --ochre-soft:#2B2519;
      --contour:rgba(111,191,163,.16);
      --shadow:0 1px 0 rgba(0,0,0,.3), 0 18px 40px -28px rgba(0,0,0,.9);
      --focus:#D9A441;
    }
  }
  :root[data-theme="dark"]{
    --paper:#131816;
    --plate:#1B2220;
    --ink:#E6EAE4;
    --ink-2:#B4BDB5;
    --muted:#8A968D;
    --line:#33403A;
    --line-soft:#26302B;
    --moss:#6FBFA3;
    --moss-soft:#1E2C27;
    --ochre:#D9A441;
    --ochre-soft:#2B2519;
    --contour:rgba(111,191,163,.16);
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 18px 40px -28px rgba(0,0,0,.9);
    --focus:#D9A441;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--f-body);
    font-weight:300;
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  #contour{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:clamp(20px,4vw,56px) clamp(16px,4vw,28px) 80px}

  h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.35}
  p{margin:0}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:2px}

  .eyebrow{
    font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);
  }

  /* ---------- 측량 눈금 진행바 ---------- */
  .ruler{display:flex;align-items:flex-end;gap:3px;height:22px;margin:18px 0 6px}
  .ruler i{flex:1;background:var(--line);height:7px;transition:height .3s ease, background .3s ease}
  .ruler i.major{height:12px}
  .ruler i.done{background:var(--moss)}
  .ruler i.now{background:var(--ochre);height:22px}
  .rulerlabel{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted)}

  /* ---------- 카드 ---------- */
  .plate{
    background:var(--plate);border:1px solid var(--line);
    box-shadow:var(--shadow);padding:clamp(22px,4vw,38px);
  }
  .stack{display:flex;flex-direction:column;gap:22px}
  .stack-sm{display:flex;flex-direction:column;gap:12px}

  /* ---------- 인트로 ---------- */
  .hero-title{font-size:clamp(34px,7vw,58px);letter-spacing:-.02em}
  .hero-title em{font-style:normal;color:var(--moss)}
  .lede{font-size:clamp(15px,2.4vw,17px);color:var(--ink-2);max-width:46ch}
  .rulebox{border-left:2px solid var(--moss);padding:2px 0 2px 16px;display:flex;flex-direction:column;gap:8px}
  .rulebox p{font-size:14px;color:var(--ink-2)}
  .rulebox b{font-weight:500;color:var(--ink)}

  .btn{
    border:1px solid var(--ink);background:var(--ink);color:var(--paper);
    padding:13px 26px;font-size:15px;font-weight:400;letter-spacing:.01em;
    transition:transform .15s ease, opacity .15s ease;
  }
  .btn:hover{transform:translateY(-1px)}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--ink)}
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  /* ---------- 문항 ---------- */
  .qnum{font-family:var(--f-mono);font-size:12px;color:var(--ochre);letter-spacing:.1em}
  .qtext{font-size:clamp(20px,3.6vw,26px);letter-spacing:-.01em}
  .opts{display:grid;gap:10px}
  @media(min-width:620px){.opts.two{grid-template-columns:1fr 1fr}}
  .opt{
    text-align:left;background:transparent;border:1px solid var(--line);
    padding:18px 18px 18px 46px;position:relative;font-size:15px;line-height:1.6;
    color:var(--ink);transition:border-color .15s ease, background .15s ease;
  }
  .opt::before{
    content:attr(data-key);position:absolute;left:16px;top:17px;
    font-family:var(--f-mono);font-size:12px;color:var(--muted);
  }
  .opt:hover{border-color:var(--moss);background:var(--moss-soft)}
  .opt[aria-pressed="true"]{border-color:var(--moss);background:var(--moss-soft);box-shadow:inset 0 0 0 1px var(--moss)}
  .opt[aria-pressed="true"]::before{color:var(--moss)}
  .opt.neutral{padding-left:18px;text-align:center;font-size:13.5px;color:var(--muted);border-style:dashed}
  .opt.neutral::before{content:none}

  /* ---------- 서술형 ---------- */
  textarea{
    width:100%;min-height:120px;resize:vertical;background:var(--paper);
    border:1px solid var(--line);color:var(--ink);font:inherit;font-size:15px;
    padding:14px;line-height:1.7;
  }
  textarea::placeholder{color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    background:transparent;border:1px dashed var(--line);color:var(--ink-2);
    padding:7px 12px;font-size:13px;line-height:1.4;text-align:left;
  }
  .chip:hover{border-style:solid;border-color:var(--ochre);color:var(--ink)}
  .hint{font-size:13px;color:var(--muted)}

  /* ---------- 결과 ---------- */
  .code{font-family:var(--f-mono);font-size:clamp(38px,9vw,64px);font-weight:500;letter-spacing:.06em;color:var(--moss);line-height:1}
  .typename{font-size:clamp(24px,4.6vw,34px);letter-spacing:-.015em}
  .caution{
    display:flex;gap:12px;border:1px solid var(--ochre);background:var(--ochre-soft);
    padding:14px 16px;font-size:13.5px;color:var(--ink-2);
  }
  .caution b{font-weight:500;color:var(--ink)}

  .axes{display:flex;flex-direction:column;gap:26px}
  .axis-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;gap:10px}
  .axis-head span{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
  .axis-head .lit{color:var(--ink);font-family:var(--f-body);font-size:14px;font-weight:500}
  .track{position:relative;height:34px;margin-top:6px}
  .track .ticks{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center}
  .track .ticks u{display:block;width:1px;height:8px;background:var(--line);text-decoration:none}
  .track .ticks u.mid{height:20px;background:var(--line)}
  .track .base{position:absolute;left:0;right:0;top:16px;height:1px;background:var(--line)}
  .track .mark{
    position:absolute;top:6px;width:2px;height:22px;background:var(--moss);
    transition:left 1s cubic-bezier(.2,.8,.2,1);
  }
  .track .mark::after{
    content:"";position:absolute;left:50%;top:-7px;width:9px;height:9px;
    background:var(--moss);transform:translateX(-50%) rotate(45deg);
  }
  .axis-note{font-size:13px;color:var(--muted);margin-top:2px}

  .signal{border-top:1px solid var(--line-soft);padding-top:16px;display:flex;flex-direction:column;gap:7px}
  .signal:first-child{border-top:0;padding-top:0}
  .signal h4{margin:0;font-family:var(--f-body);font-size:16px;font-weight:500}
  .signal .why{font-size:13.5px;color:var(--muted)}
  .signal .why b{font-weight:400;color:var(--ink-2)}
  .strength{font-family:var(--f-mono);font-size:11px;color:var(--ochre);letter-spacing:.1em}

  .quote{
    border-left:2px solid var(--line);padding-left:16px;font-size:15px;color:var(--ink-2);
    white-space:pre-wrap;word-break:break-word;
  }
  .quote.empty{color:var(--muted);font-style:italic;border-left-style:dashed}

  .decl{border:1px solid var(--moss);padding:clamp(20px,4vw,30px);display:flex;flex-direction:column;gap:14px;background:var(--moss-soft)}
  .decl .line{font-family:var(--f-display);font-size:clamp(18px,3.2vw,23px);line-height:1.85}
  .decl input{
    font:inherit;font-family:var(--f-display);font-size:inherit;color:var(--ink);
    background:transparent;border:0;border-bottom:1px solid var(--moss);
    padding:0 4px 2px;min-width:8ch;
  }
  .decl input:focus{outline:none;border-bottom-width:2px;background:var(--plate)}

  .todo{display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--line-soft);padding-top:14px}
  .todo:first-child{border-top:0;padding-top:0}
  .todo input[type=checkbox]{margin-top:6px;width:16px;height:16px;accent-color:var(--moss);flex:none}
  .todo .t{font-size:15px}
  .todo .c{font-size:13px;color:var(--muted)}

  .divider{height:1px;background:var(--line-soft);border:0;margin:0}
  .section-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ochre)}

  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--paper);padding:11px 20px;font-size:14px;
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:9;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .fade{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important}
  }
</style>

<canvas id="contour" aria-hidden="true"></canvas>

<div class="wrap">
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  /* ===================== 데이터 ===================== */

  // 4개의 축. a = 왼쪽 극, b = 오른쪽 극
  var AXES = [
    { id:"ground", a:{k:"F", name:"자유", desc:"정해지지 않은 여지가 있을 때 편안해진다"},
                   b:{k:"S", name:"안정", desc:"예측 가능한 기반이 있을 때 편안해진다"} },
    { id:"outlet", a:{k:"E", name:"표현", desc:"밖으로 내보이고 반응이 돌아올 때 살아난다"},
                   b:{k:"D", name:"축적", desc:"아무도 몰라도 안에 쌓일 때 살아난다"} },
    { id:"people", a:{k:"C", name:"연결", desc:"사람 사이에서 에너지가 생긴다"},
                   b:{k:"Q", name:"고요", desc:"혼자 있는 시간에 회복된다"} },
    { id:"motion", a:{k:"M", name:"완성", desc:"끝까지 마무리했을 때 만족한다"},
                   b:{k:"X", name:"탐험", desc:"새로 시작할 때 만족한다"} }
  ];

  var QUESTIONS = [
    // 자유 / 안정
    {ax:0, q:"새로운 일을 시작할 때, 마음이 더 놓이는 쪽은?",
     a:"“해보면서 방법을 찾아도 된다”고 할 때", b:"“이 순서대로 하면 된다”가 정해져 있을 때"},
    {ax:0, q:"다음 달 일정표를 열었을 때 마음이 편한 쪽은?",
     a:"빈칸이 많이 남아 있을 때", b:"거의 다 채워져 있을 때"},
    {ax:0, q:"한 달 수입이 비슷하다면 어느 쪽을 고르겠어요?",
     a:"금액이 달라도 내가 시간을 정하는 일", b:"시간이 정해져 있어도 매달 같은 금액이 들어오는 일"},
    {ax:0, q:"답답함을 더 자주 느끼는 순간은?",
     a:"선택지가 하나로 좁혀졌을 때", b:"앞으로 어떻게 될지 모를 때"},
    // 표현 / 축적
    {ax:1, q:"일을 끝내고 더 기분이 좋은 쪽은?",
     a:"누군가 그걸 보고 반응을 남겼을 때", b:"아무도 몰라도 내가 늘었다고 느낄 때"},
    {ax:1, q:"새로 배운 걸 보통 어떻게 하나요?",
     a:"어딘가에 정리해서 올려둔다", b:"내 노트에만 남겨둔다"},
    {ax:1, q:"하루가 아깝게 느껴질 때는 주로?",
     a:"하고 싶은 말을 못 꺼냈을 때", b:"남는 게 하나도 없었을 때"},
    {ax:1, q:"더 듣고 싶은 말은?",
     a:"“네가 한 말이 계속 기억에 남아”", b:"“너 진짜 많이 늘었더라”"},
    // 연결 / 고요
    {ax:2, q:"일이 안 풀린 날 저녁, 어떻게 하면 풀리나요?",
     a:"누군가에게 이야기해야 풀린다", b:"혼자 있는 시간이 있어야 풀린다"},
    {ax:2, q:"집중이 더 잘 되는 곳은?",
     a:"사람 소리가 어느 정도 있는 곳", b:"방해가 없는 조용한 곳"},
    {ax:2, q:"여행에서 더 오래 기억에 남는 건?",
     a:"거기서 만난 사람", b:"혼자 걸었던 길"},
    {ax:2, q:"더 부담스러운 쪽은?",
     a:"며칠 동안 아무와도 이야기하지 않는 것", b:"며칠 동안 계속 사람들과 붙어 있는 것"},
    // 완성 / 탐험
    {ax:3, q:"실제로 더 자주 하는 쪽은?",
     a:"시작한 건 재미없어져도 끝을 본다", b:"재미가 식으면 다음 걸 시작한다"},
    {ax:3, q:"내 책장이나 폴더를 떠올리면?",
     a:"끝낸 것들이 줄지어 있다", b:"시작만 해둔 것들이 많다"},
    {ax:3, q:"더 뿌듯했던 순간은?",
     a:"마지막 하나를 마무리했을 때", b:"처음 해보는 걸 손대기 시작했을 때"},
    {ax:3, q:"같은 일을 3년째 하고 있다면 드는 생각은?",
     a:"이제야 좀 알겠다 싶다", b:"슬슬 다른 걸 해보고 싶다"}
  ];

  var WRITTEN = [
    { id:"ease", label:"실제 경험 1",
      q:"최근에 “이게 나답다” 싶게 편안했던 순간은 언제였나요?",
      ph:"언제, 어디서, 누구와 있었는지까지 적으면 나중에 반복되는 무늬가 보입니다.",
      ex:["혼자 아침 일찍 카페에서 아무 방해 없이 두 시간 작업했을 때",
          "친구들이 내가 만든 걸 보고 계속 질문했을 때",
          "미뤄뒀던 일을 하나 끝내고 목록에서 지웠을 때"] },
    { id:"escape", label:"실제 경험 2",
      q:"반복해서 벗어나고 싶었던 상황은 어떤 상황인가요?",
      ph:"“그 일 자체”보다 “그때 무엇이 가장 힘들었는지”를 적어보세요.",
      ex:["내 판단이 아니라 남의 결정만 기다리며 앉아 있는 시간",
          "설명 없이 하라는 대로만 해야 할 때",
          "하루 종일 사람을 상대하고 집에 오면 아무 말도 못 하는 상태"] },
    { id:"envy", label:"실제 경험 3",
      q:"최근에 특별히 부러웠던 사람이 있다면, 그 사람의 어떤 모습이었나요?",
      ph:"그 사람 자체가 아니라 ‘어떤 모습’이 부러웠는지가 중요합니다.",
      ex:["자기 일정을 스스로 정해서 사는 모습",
          "자기 생각을 눈치 안 보고 꺼내는 모습",
          "한 가지를 오래 해서 그 분야에서 인정받는 모습"] },
    { id:"day", label:"원하는 하루",
      q:"돈과 남의 평가 걱정이 전혀 없다면, 하루를 어떻게 보내고 싶나요?",
      ph:"직업 이름 말고, 아침부터 저녁까지의 실제 장면으로 적어보세요.",
      ex:["오전엔 혼자 만들고, 오후엔 사람들 만나고, 저녁엔 조용히 정리",
          "정해진 출근 없이 그날 컨디션에 따라 일하는 하루",
          "같은 시간에 일어나 같은 일을 하되, 그 일이 내가 고른 일인 하루"] },
    { id:"fear", label:"막는 것",
      q:"그 삶을 지금 선택하지 못하게 막는, 가장 현실적인 걱정은 무엇인가요?",
      ph:"막연한 불안 말고, 실제로 무엇이 걱정되는지 구체적으로요.",
      ex:["수입이 끊기면 버틸 돈이 없다",
          "지금 그만두면 다시 못 돌아갈 것 같다",
          "주변에서 실패했다고 볼 것 같다"] }
  ];

  var TYPE_NAMES = {
    FECM:"판을 벌이고 끝까지 미는 사람", FECX:"사람을 모아 새 판을 여는 사람",
    FEQM:"혼자 만들어 세상에 내놓는 사람", FEQX:"떠돌며 기록해 남기는 사람",
    FDCM:"곁에서 끝맺음을 맡는 사람",   FDCX:"사람을 따라 길을 넓히는 사람",
    FDQM:"조용히 하나를 완성하는 사람", FDQX:"혼자 멀리까지 파고드는 사람",
    SECM:"자리를 지키며 앞에 서는 사람", SECX:"안전한 자리에서 새것을 여는 사람",
    SEQM:"쌓아두었다가 한 번에 내보이는 사람", SEQX:"기반 위에서 계속 실험하는 사람",
    SDCM:"지켜서 다음으로 넘기는 사람", SDCX:"천천히 사람과 함께 넓히는 사람",
    SDQM:"묵묵히 오래 쌓는 사람",       SDQX:"안에서 조용히 계속 바꿔보는 사람"
  };

  var WAY = { CM:"사람들과 함께 끝까지 밀고 가는", CX:"사람들과 함께 새로 벌이는",
              QM:"혼자 조용히 완성해가는",       QX:"혼자 조용히 계속 바꿔보는" };
  var GIVE = { FE:"“다르게 해도 된다”는 감각", FD:"서두르지 않아도 깊어진다는 것",
               SE:"꾸준한 것도 눈에 띌 수 있다는 것", SD:"오래 남는 것의 힘" };

  var ACTIONS = {
    F:["일정 하나를 일부러 비워두고, 그 시간에 뭘 할지 당일에 정하기","비워둔 시간이 편했는지 불안했는지 한 줄 적기"],
    S:["매일 같은 시간에 하는 일을 하나 정해 7일 지켜보기","반복이 답답했는지 안심됐는지 한 줄 적기"],
    E:["만든 것이나 생각 하나를 어디든 한 번 꺼내 보이기","반응이 왔을 때 마음이 어땠는지 한 줄 적기"],
    D:["하루 20분, 아무에게도 안 보여줄 걸 쌓아보기","보여줄 데가 없어도 계속하고 싶은지 확인하기"],
    C:["오래 못 본 사람 한 명에게 먼저 연락해 30분 이야기하기","만나고 온 뒤 에너지가 늘었는지 줄었는지 적기"],
    Q:["하루 한 시간, 알림 끄고 혼자 있는 시간 만들기","그 시간이 회복이었는지 지루함이었는지 적기"],
    M:["미뤄둔 것 중 가장 작은 하나를 골라 이번 주에 끝내기","끝냈을 때 실제로 뿌듯했는지 확인하기"],
    X:["해본 적 없는 걸 하나 골라 30분만 시도해보기","30분 뒤에도 계속하고 싶었는지 적기"]
  };

  /* ===================== 상태 ===================== */

  var KEY = "self-map-v1";
  var state = { step:-1, ans:{}, text:{}, decl:{}, done:[], feedback:"" };

  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return false;
      var v = JSON.parse(raw);
      if(v && typeof v==="object" && v.ans){ state = Object.assign(state, v); return true; }
    }catch(e){}
    return false;
  }
  var resumable = load();
  var TOTAL = QUESTIONS.length + WRITTEN.length;

  /* ===================== 채점 ===================== */

  function scores(){
    var out = AXES.map(function(){ return {sum:0, answered:0, forA:[], forB:[]}; });
    QUESTIONS.forEach(function(q, i){
      var v = state.ans[i];
      if(v === undefined) return;
      out[q.ax].answered++;
      if(v === 1){ out[q.ax].sum += 1; out[q.ax].forA.push(i); }
      else if(v === -1){ out[q.ax].sum -= 1; out[q.ax].forB.push(i); }
    });
    return out;
  }

  function poleOf(axIdx, s){
    var ax = AXES[axIdx];
    if(s.sum > 0) return {pole:ax.a, side:"a", strength:Math.abs(s.sum)};
    if(s.sum < 0) return {pole:ax.b, side:"b", strength:Math.abs(s.sum)};
    return {pole:null, side:"mid", strength:0};
  }

  function typeCode(sc){
    return AXES.map(function(ax,i){
      var p = poleOf(i, sc[i]);
      return p.pole ? p.pole.k : "·";
    }).join("");
  }

  /* ===================== 렌더 ===================== */

  var app = document.getElementById("app");

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  // 마지막 글자에 받침이 있는지 — 조사(을/를, 와/과) 선택용
  function hasJong(str){
    var t = String(str||"").replace(/[\s"'“”‘’).\]]+$/,"");
    if(!t) return false;
    var c = t.charCodeAt(t.length-1);
    if(c < 0xAC00 || c > 0xD7A3) return true; // 한글이 아니면 기본값
    return (c - 0xAC00) % 28 !== 0;
  }
  function josa(word, withJong, withoutJong){ return hasJong(word) ? withJong : withoutJong; }
  function inputSize(v){ return Math.max(7, Math.ceil(String(v).length * 1.8)); }

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("show"); }, 1900);
  }

  function ruler(step){
    var html = '<div class="ruler" role="progressbar" aria-valuemin="1" aria-valuemax="'+TOTAL+'" aria-valuenow="'+(step+1)+'" aria-label="진행 상황">';
    for(var i=0;i<TOTAL;i++){
      var cls = (i%4===3?"major":"");
      if(i < step) cls += " done";
      if(i === step) cls += " now";
      html += '<i class="'+cls.trim()+'"></i>';
    }
    html += '</div><div class="rulerlabel"><span>'+String(step+1).padStart(2,"0")+' / '+TOTAL+'</span><span>'+
            (step < QUESTIONS.length ? "선택" : "직접 쓰기")+'</span></div>';
    return html;
  }

  function render(){
    window.scrollTo({top:0, behavior:"instant"});
    if(state.step === -1) return renderIntro();
    if(state.step < QUESTIONS.length) return renderQuestion(state.step);
    if(state.step < TOTAL) return renderWritten(state.step - QUESTIONS.length);
    return renderResult();
  }

  function renderIntro(){
    app.innerHTML =
    '<div class="stack fade">'+
      '<div class="stack-sm">'+
        '<div class="eyebrow">자기 탐색 · 21문항 · 약 8분</div>'+
        '<h1 class="hero-title">나의 <em>자아 지형도</em></h1>'+
        '<p class="lede">성격 유형을 맞히는 검사가 아닙니다. 서로 다른 이야기에서 <b>반복해서 나타나는 것</b>을 찾아, 앞으로 어느 쪽을 선택하고 싶은지 정리하는 도구입니다.</p>'+
      '</div>'+
      '<div class="plate stack">'+
        '<div class="rulebox">'+
          '<p><b>16문항</b> · 둘 중 더 나 같은 장면을 고릅니다. 정답은 없고, 모르겠으면 넘겨도 됩니다.</p>'+
          '<p><b>5문항</b> · 실제로 있었던 일을 직접 씁니다. 이게 결과의 근거가 됩니다.</p>'+
          '<p><b>결과</b> · 4개 축 위의 내 위치, 반복해서 나온 욕구 3가지, 내 문장으로 고쳐 쓰는 자아 선언문, 7일 안에 해볼 행동 3가지.</p>'+
        '</div>'+
        '<hr class="divider">'+
        '<p class="hint">결과는 진단이 아니라 <b style="color:var(--ink);font-weight:400">가설</b>입니다. 맞지 않는 부분은 마지막에 직접 고칠 수 있습니다. 답변은 이 브라우저에만 저장되고 어디로도 전송되지 않습니다.</p>'+
        '<div class="btnrow">'+
          '<button class="btn" id="start">시작하기</button>'+
          (resumable && (Object.keys(state.ans).length || state.step>0)
            ? '<button class="btn ghost" id="resume">이어서 하기 ('+(Math.min(state.step,TOTAL-1)+1)+'/'+TOTAL+')</button>' : '')+
        '</div>'+
      '</div>'+
    '</div>';

    document.getElementById("start").onclick = function(){
      state = {step:0, ans:{}, text:{}, decl:{}, done:[], feedback:""};
      save(); render();
    };
    var r = document.getElementById("resume");
    if(r) r.onclick = function(){ if(state.step<0) state.step=0; render(); };
  }

  function renderQuestion(i){
    var q = QUESTIONS[i], cur = state.ans[i];
    app.innerHTML =
    ruler(i)+
    '<div class="plate stack fade" style="margin-top:20px">'+
      '<div class="stack-sm">'+
        '<div class="qnum">문항 '+String(i+1).padStart(2,"0")+' · '+AXES[q.ax].a.name+' / '+AXES[q.ax].b.name+'</div>'+
        '<h2 class="qtext">'+esc(q.q)+'</h2>'+
      '</div>'+
      '<div class="opts two">'+
        '<button class="opt" data-key="A" data-v="1" aria-pressed="'+(cur===1)+'">'+esc(q.a)+'</button>'+
        '<button class="opt" data-key="B" data-v="-1" aria-pressed="'+(cur===-1)+'">'+esc(q.b)+'</button>'+
      '</div>'+
      '<button class="opt neutral" data-v="0" aria-pressed="'+(cur===0)+'">둘 다 비슷하다 / 잘 모르겠다</button>'+
      '<hr class="divider">'+
      '<div class="btnrow">'+
        '<button class="btn ghost" id="prev">이전</button>'+
        '<button class="btn" id="next"'+(cur===undefined?" disabled":"")+'>다음</button>'+
      '</div>'+
    '</div>';

    Array.prototype.forEach.call(app.querySelectorAll(".opt"), function(b){
      b.onclick = function(){
        state.ans[i] = Number(b.dataset.v); save();
        Array.prototype.forEach.call(app.querySelectorAll(".opt"), function(x){
          x.setAttribute("aria-pressed", String(Number(x.dataset.v)===state.ans[i]));
        });
        document.getElementById("next").disabled = false;
        setTimeout(function(){ state.step = i+1; save(); render(); }, 240);
      };
    });
    document.getElementById("prev").onclick = function(){ state.step = i-1; save(); render(); };
    document.getElementById("next").onclick = function(){ state.step = i+1; save(); render(); };
  }

  function renderWritten(j){
    var w = WRITTEN[j], step = QUESTIONS.length + j;
    app.innerHTML =
    ruler(step)+
    '<div class="plate stack fade" style="margin-top:20px">'+
      '<div class="stack-sm">'+
        '<div class="qnum">'+esc(w.label)+'</div>'+
        '<h2 class="qtext">'+esc(w.q)+'</h2>'+
        '<p class="hint">'+esc(w.ph)+'</p>'+
      '</div>'+
      '<textarea id="ta" placeholder="여기에 적어주세요">'+esc(state.text[w.id]||"")+'</textarea>'+
      '<div class="stack-sm">'+
        '<div class="hint">떠오르지 않으면, 가까운 것을 눌러 고쳐 쓰세요.</div>'+
        '<div class="chips">'+ w.ex.map(function(e){
            return '<button class="chip" type="button">'+esc(e)+'</button>'; }).join("")+'</div>'+
      '</div>'+
      '<hr class="divider">'+
      '<div class="btnrow">'+
        '<button class="btn ghost" id="prev">이전</button>'+
        '<button class="btn" id="next">'+(step===TOTAL-1?"결과 보기":"다음")+'</button>'+
        '<button class="btn ghost" id="skip">건너뛰기</button>'+
      '</div>'+
    '</div>';

    var ta = document.getElementById("ta");
    ta.oninput = function(){ state.text[w.id] = ta.value; save(); };
    Array.prototype.forEach.call(app.querySelectorAll(".chip"), function(c){
      c.onclick = function(){
        ta.value = (ta.value.trim() ? ta.value.replace(/\s*$/,"") + "\n" : "") + c.textContent;
        state.text[w.id] = ta.value; save(); ta.focus();
        ta.setSelectionRange(ta.value.length, ta.value.length);
      };
    });
    document.getElementById("prev").onclick = function(){ state.step = step-1; save(); render(); };
    document.getElementById("next").onclick = function(){ state.step = step+1; save(); render(); };
    document.getElementById("skip").onclick = function(){ state.step = step+1; save(); render(); };
  }

  /* ===================== 결과 ===================== */

  function renderResult(){
    var sc = scores();
    var code = typeCode(sc);
    var name = TYPE_NAMES[code] || "아직 한쪽으로 기울지 않은 사람";

    // 강한 순서로 정렬된 축
    var ranked = AXES.map(function(ax,i){
      return {i:i, s:sc[i], p:poleOf(i, sc[i])};
    }).sort(function(x,y){ return y.p.strength - x.p.strength; });

    var top3 = ranked.filter(function(r){ return r.p.strength > 0; }).slice(0,3);

    // 선언문 초안
    var valueWords = top3.slice(0,2).map(function(r){ return r.p.pole.name; });
    if(!valueWords.length) valueWords = ["아직 고르는 중인 것"];
    var valueJoined = valueWords.length > 1
      ? valueWords[0] + josa(valueWords[0], "과 ", "와 ") + valueWords.slice(1).join(", ")
      : valueWords[0];
    var wayKey = (poleOf(2,sc[2]).pole ? poleOf(2,sc[2]).pole.k : "Q") + (poleOf(3,sc[3]).pole ? poleOf(3,sc[3]).pole.k : "M");
    var giveKey = (poleOf(0,sc[0]).pole ? poleOf(0,sc[0]).pole.k : "F") + (poleOf(1,sc[1]).pole ? poleOf(1,sc[1]).pole.k : "E");

    var d1 = state.decl.v || valueJoined;
    var d2 = state.decl.w || (WAY[wayKey] || "나에게 맞는");
    var d3 = state.decl.g || (GIVE[giveKey] || "내가 겪어 알게 된 것");

    // 7일 행동
    var actKeys = top3.map(function(r){ return r.p.pole.k; });
    while(actKeys.length < 3){
      var fill = ["M","Q","F","E"].filter(function(k){ return actKeys.indexOf(k)<0; })[0];
      actKeys.push(fill);
    }

    var axesHtml = AXES.map(function(ax,i){
      var s = sc[i], p = poleOf(i, s);
      var pct = 4 + ((s.sum + 4) / 8) * 92;
      var lit = p.pole ? p.pole.name : "가운데";
      var note = p.pole ? p.pole.desc : "이 축은 어느 쪽으로도 기울지 않았습니다. 지금은 상황에 따라 달라지는 영역일 수 있어요.";
      return '<div>'+
        '<div class="axis-head">'+
          '<span'+(p.side==="a"?' class="lit"':"")+'>'+ax.a.name+' '+ax.a.k+'</span>'+
          '<span class="strength">'+(p.strength?("강도 "+p.strength+"/4"):"중립")+'</span>'+
          '<span'+(p.side==="b"?' class="lit"':"")+'>'+ax.b.k+' '+ax.b.name+'</span>'+
        '</div>'+
        '<div class="track"><div class="base"></div>'+
          '<div class="ticks"><u></u><u></u><u class="mid"></u><u></u><u></u></div>'+
          '<div class="mark" data-pct="'+pct+'" style="left:50%"></div>'+
        '</div>'+
        '<div class="axis-note">→ '+esc(lit)+' · '+esc(note)+'</div>'+
      '</div>';
    }).join("");

    var signalHtml = top3.length ? top3.map(function(r){
      var picks = (r.p.side==="a" ? r.s.forA : r.s.forB).slice(0,2).map(function(qi){
        var q = QUESTIONS[qi];
        return "“" + (r.p.side==="a" ? q.a : q.b) + "”";
      });
      return '<div class="signal">'+
        '<h4>'+esc(r.p.pole.name)+' <span class="strength">'+r.p.strength+'/4</span></h4>'+
        '<p class="why">'+esc(r.p.pole.desc)+'</p>'+
        '<p class="why">근거로 고른 답: <b>'+esc(picks.join(", "))+'</b></p>'+
      '</div>';
    }).join("") : '<p class="hint">뚜렷하게 반복된 축이 없습니다. 문항을 더 채우거나, 아래 직접 쓴 답을 다시 읽어보세요.</p>';

    function quoteBlock(id, fallback){
      var v = (state.text[id]||"").trim();
      return v ? '<p class="quote">'+esc(v)+'</p>'
               : '<p class="quote empty">'+esc(fallback)+'</p>';
    }

    app.innerHTML =
    '<div class="stack fade">'+

      '<div class="plate stack">'+
        '<div class="eyebrow">측정 결과 · 가설</div>'+
        '<div class="code">'+esc(code)+'</div>'+
        '<h1 class="typename">'+esc(name)+'</h1>'+
        '<div class="caution"><span>※</span><div>이건 진단이 아니라 <b>가설</b>입니다. 당신이 고른 답에서 반복된 것을 정리했을 뿐이고, 맞는지는 아래 ‘7일 안에 해볼 것’으로 직접 확인하는 게 순서입니다.</div></div>'+
      '</div>'+

      '<div class="plate stack">'+
        '<div class="section-label">네 개의 축에서 내 위치</div>'+
        '<div class="axes">'+axesHtml+'</div>'+
      '</div>'+

      '<div class="plate stack">'+
        '<div class="section-label">반복해서 나타난 것</div>'+
        '<p class="hint">서로 다른 문항에서 같은 방향이 반복될수록 강도가 올라갑니다.</p>'+
        '<div class="stack-sm">'+signalHtml+'</div>'+
      '</div>'+

      '<div class="plate stack">'+
        '<div class="section-label">내가 직접 쓴 것</div>'+
        '<div class="stack-sm"><p class="hint">나답고 편안했던 순간</p>'+quoteBlock("ease","이 항목은 건너뛰었습니다.")+'</div>'+
        '<div class="stack-sm"><p class="hint">반복해서 벗어나고 싶었던 상황</p>'+quoteBlock("escape","이 항목은 건너뛰었습니다.")+'</div>'+
        '<div class="stack-sm"><p class="hint">부러웠던 모습</p>'+quoteBlock("envy","이 항목은 건너뛰었습니다.")+'</div>'+
        '<div class="stack-sm"><p class="hint">돈과 평가 걱정이 없다면 보내고 싶은 하루</p>'+quoteBlock("day","이 항목은 건너뛰었습니다.")+'</div>'+
        '<hr class="divider">'+
        '<div class="stack-sm">'+
          '<p class="hint">지금까지 나를 지켜준 오래된 걱정</p>'+
          quoteBlock("fear","이 항목은 건너뛰었습니다.")+
          '<p class="hint" style="margin-top:6px">이 걱정은 한때 분명히 나를 지켜줬을 겁니다. 지금 물어볼 건 하나입니다 — <b style="color:var(--ink);font-weight:400">이게 여전히 필요한 보호인가, 아니면 이제는 나를 묶어두고 있는가?</b></p>'+
        '</div>'+
      '</div>'+

      '<div class="plate stack">'+
        '<div class="section-label">나의 자아 선언문</div>'+
        '<p class="hint">아래는 당신의 답에서 만든 <b>초안</b>입니다. 밑줄 친 부분을 당신의 말로 직접 고쳐 쓰세요.</p>'+
        '<div class="decl">'+
          '<div class="line">나는 <input id="dv" value="'+esc(d1)+'" size="'+inputSize(d1)+'" aria-label="중요하게 여기는 것"><span id="jv">'+josa(d1,"을","를")+'</span> 중요하게 여기며,</div>'+
          '<div class="line"><input id="dw" value="'+esc(d2)+'" size="'+inputSize(d2)+'" aria-label="살아가는 방식"> 방식으로 살아가고,</div>'+
          '<div class="line"><input id="dg" value="'+esc(d3)+'" size="'+inputSize(d3)+'" aria-label="세상에 전하는 것"><span id="jg">'+josa(d3,"을","를")+'</span> 전하는 사람이다.</div>'+
        '</div>'+
        '<p class="hint">이 문장이 새로운 의무처럼 느껴진다면 그건 아직 내 문장이 아닙니다. 부담이 되는 단어는 지우고, 지금 실제로 끌리는 말로 바꿔도 됩니다.</p>'+
      '</div>'+

      '<div class="plate stack">'+
        '<div class="section-label">7일 안에 해볼 것</div>'+
        '<p class="hint">이건 목표가 아니라 <b>확인</b>입니다. 위 가설이 나와 맞는지 작게 시험해보는 용도예요.</p>'+
        '<div class="stack-sm">'+ actKeys.map(function(k, n){
            var a = ACTIONS[k];
            return '<label class="todo">'+
              '<input type="checkbox" data-n="'+n+'"'+(state.done.indexOf(n)>=0?" checked":"")+'>'+
              '<span><span class="t">'+esc(a[0])+'</span><br><span class="c">확인할 것 — '+esc(a[1])+'</span></span>'+
            '</label>';
          }).join("")+'</div>'+
      '</div>'+

      '<div class="plate stack">'+
        '<div class="section-label">마지막으로</div>'+
        '<h3 style="font-size:19px">이 정리에서 “정말 내 이야기 같다” 싶은 부분과 “조금 아닌 것 같다” 싶은 부분은 각각 무엇인가요?</h3>'+
        '<textarea id="fb" placeholder="맞는 부분 / 아닌 부분을 나눠서 적어보세요. 아닌 부분이 오히려 더 중요한 단서입니다.">'+esc(state.feedback||"")+'</textarea>'+
        '<hr class="divider">'+
        '<div class="btnrow">'+
          '<button class="btn" id="copy">결과 전체 복사</button>'+
          '<button class="btn ghost" id="back">답변 고치기</button>'+
          '<button class="btn ghost" id="reset">처음부터 다시</button>'+
        '</div>'+
      '</div>'+

    '</div>';

    // 마커 애니메이션
    setTimeout(function(){
      Array.prototype.forEach.call(app.querySelectorAll(".mark"), function(m){
        m.style.left = m.dataset.pct + "%";
      });
    }, 40);

    ["dv","dw","dg"].forEach(function(id, n){
      var el = document.getElementById(id);
      el.oninput = function(){
        state.decl[["v","w","g"][n]] = el.value;
        el.size = inputSize(el.value);
        if(id==="dv") document.getElementById("jv").textContent = josa(el.value,"을","를");
        if(id==="dg") document.getElementById("jg").textContent = josa(el.value,"을","를");
        save();
      };
    });
    Array.prototype.forEach.call(app.querySelectorAll('.todo input'), function(c){
      c.onchange = function(){
        var n = Number(c.dataset.n), k = state.done.indexOf(n);
        if(c.checked && k<0) state.done.push(n);
        if(!c.checked && k>=0) state.done.splice(k,1);
        save();
      };
    });
    var fb = document.getElementById("fb");
    fb.oninput = function(){ state.feedback = fb.value; save(); };

    document.getElementById("back").onclick = function(){ state.step = TOTAL-1; save(); render(); };
    document.getElementById("reset").onclick = function(){
      state = {step:-1, ans:{}, text:{}, decl:{}, done:[], feedback:""}; save(); resumable=false; render();
    };
    document.getElementById("copy").onclick = function(){
      var t = buildText(code, name, sc, top3, [d1,d2,d3], actKeys);
      navigator.clipboard.writeText(t).then(function(){ toast("결과를 복사했습니다"); },
        function(){ toast("복사에 실패했습니다. 화면에서 직접 선택해 주세요."); });
    };
  }

  function buildText(code, name, sc, top3, decl, actKeys){
    var L = [];
    L.push("나의 자아 지형도 — " + code + " / " + name);
    L.push("(진단이 아니라 가설입니다)");
    L.push("");
    L.push("[네 축에서의 위치]");
    AXES.forEach(function(ax,i){
      var p = poleOf(i, sc[i]);
      L.push("· " + ax.a.name + " ↔ " + ax.b.name + " → " + (p.pole ? p.pole.name + " (강도 " + p.strength + "/4)" : "가운데"));
    });
    L.push("");
    L.push("[반복해서 나타난 것]");
    if(top3.length) top3.forEach(function(r){ L.push("· " + r.p.pole.name + " — " + r.p.pole.desc); });
    else L.push("· 뚜렷하게 반복된 축 없음");
    L.push("");
    L.push("[내가 직접 쓴 것]");
    WRITTEN.forEach(function(w){
      var v = (state.text[w.id]||"").trim();
      L.push("· " + w.q);
      L.push("  " + (v || "(건너뜀)"));
    });
    L.push("");
    L.push("[자아 선언문]");
    L.push("나는 " + decl[0] + josa(decl[0],"을","를") + " 중요하게 여기며,");
    L.push(decl[1] + " 방식으로 살아가고,");
    L.push(decl[2] + josa(decl[2],"을","를") + " 전하는 사람이다.");
    L.push("");
    L.push("[7일 안에 해볼 것]");
    actKeys.forEach(function(k){ L.push("· " + ACTIONS[k][0] + " / 확인 — " + ACTIONS[k][1]); });
    if((state.feedback||"").trim()){
      L.push("");
      L.push("[맞는 부분 / 아닌 부분]");
      L.push(state.feedback.trim());
    }
    return L.join("\n");
  }

  /* ===================== 등고선 배경 ===================== */

  (function contours(){
    var cv = document.getElementById("contour"), ctx = cv.getContext("2d");
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var w, h, dpr;
    function size(){
      dpr = Math.min(window.devicePixelRatio||1, 2);
      w = cv.clientWidth; h = cv.clientHeight;
      cv.width = w*dpr; cv.height = h*dpr;
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    function stroke(){
      return getComputedStyle(document.documentElement).getPropertyValue("--contour").trim() || "rgba(0,0,0,.1)";
    }
    var t = 0;
    function draw(){
      ctx.clearRect(0,0,w,h);
      ctx.strokeStyle = stroke();
      ctx.lineWidth = 1;
      var lines = 16, cx = w*0.5, cy = h*0.42;
      for(var n=0;n<lines;n++){
        ctx.beginPath();
        var r = 60 + n*Math.max(46, w/14);
        for(var a=0;a<=Math.PI*2+0.05;a+=0.06){
          var wob = Math.sin(a*3 + n*0.7 + t) * (16 + n*3)
                  + Math.cos(a*5 - n*0.4 - t*0.7) * (9 + n*1.6);
          var rr = r + wob;
          var x = cx + Math.cos(a)*rr*1.25;
          var y = cy + Math.sin(a)*rr*0.62;
          if(a===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.closePath();
        ctx.stroke();
      }
    }
    function loop(){ t += 0.0016; draw(); requestAnimationFrame(loop); }
    window.addEventListener("resize", function(){ size(); draw(); });
    size();
    if(reduce) draw(); else loop();
  })();

  render();
})();
</script>
